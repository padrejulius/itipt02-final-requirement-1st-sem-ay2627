<ion-header>
  <ion-toolbar>
    <ion-title>
       <h2 id="title"> ADMIN LOGIN FORM </h2>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="button">
  <ion-input id="username" class="cont" label="Username" label-placement="floating" fill="solid"></ion-input>
  <ion-input id="password" class="cont" type="password" label="Password" label-placement="floating" fill="solid"></ion-input>

  <div class="button-group">
    <ion-button color="success" expand="block" id="login" routerLink="/admin"> Login </ion-button>
    <ion-button color="danger" expand="block" id="cancel" routerLink="/home"> Cancel </ion-button>
  </div>
  </div>
  
</ion-content>
