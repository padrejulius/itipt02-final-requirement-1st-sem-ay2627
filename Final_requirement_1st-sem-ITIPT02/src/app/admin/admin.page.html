<ion-header>
  <ion-toolbar>
    <ion-title> Admin </ion-title>
    <ion-buttons slot="end" class="ion-padding">
      <ion-button>
        <ion-icon name="menu-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h1> ATTENDANCE SHEET </h1>
  <h3 class="ion-padding"> Requests: </h3>

  <div class="requests-container">

    <ion-card class="request-card">
      <ion-card-content class="ion-text-center">
        <ion-avatar class="avatar-center">
          <img src="https://ionicframework.com/docs/img/demos/avatar.ionic.png" alt="Profile" />
        </ion-avatar>
        <h4>Juan Dela Cruz</h4>
        <ion-button color="success" size="small" shape="round">
          ACCEPT
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-card class="request-card">
      <ion-card-content class="ion-text-center">
        <h4>Maria Clara</h4>
        <ion-button color="success" size="small" shape="round">
          ACCEPT
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-card class="request-card">
      <ion-card-content class="ion-text-center">
        <h4>Pedro Penduko</h4>
        <ion-button color="success" size="small" shape="round">
          ACCEPT
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>

  <h3 class="ion-padding">Accepted:</h3>
  
  <ion-list lines="none">
    <ion-item class="accepted-item ion-margin-bottom">
      <ion-label>Juan Dela Cruz</ion-label>
      <ion-button slot="end" color="danger" size="small" shape="round">
        REMOVE
      </ion-button>
    </ion-item>

    <ion-item class="accepted-item ion-margin-bottom">
      <ion-label>Maria Clara</ion-label>
      <ion-button slot="end" color="danger" size="small" shape="round">
        REMOVE
      </ion-button>
    </ion-item>
  </ion-list>
  
</ion-content>
