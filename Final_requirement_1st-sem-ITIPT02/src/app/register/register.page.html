<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title id="title">REGISTER FORM</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-input class="underline-input" fill="solid" labelPlacement="floating" label="Full Name:"></ion-input>
  <ion-input class="underline-input" fill="solid" labelPlacement="floating" label="Username:"></ion-input>
  <ion-input class="underline-input" fill="solid" labelPlacement="floating" label="Gender:"></ion-input>
  <ion-input class="underline-input" fill="solid" labelPlacement="floating" label="Contact No.:"></ion-input>
  <ion-input class="underline-input" type="password" fill="solid" labelPlacement="floating" label="Password:"></ion-input>
  <ion-input class="custom-input" type="password" class="underline-input" fill="solid" labelPlacement="floating" label="Confirm Password:"></ion-input>
  <ion-button color="success" id="submit"> Submit </ion-button>
</ion-content>
