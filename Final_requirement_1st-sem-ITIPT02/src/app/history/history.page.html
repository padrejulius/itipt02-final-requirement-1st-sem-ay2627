<ion-header>
  <ion-toolbar>
    <ion-title>History</ion-title>
    <ion-buttons slot="end" class="ion-padding">
      <ion-button>
        <ion-icon name="menu-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1> ATTENDANCE LOGS </h1>
  
  <ion-searchbar placeholder="Search name or date..."></ion-searchbar>

  <h3 class="ion-padding">Recent Records:</h3>

  <ion-list lines="none">
    
    
    <ion-item class="history-item ion-margin-bottom">
      <ion-label>
        <h2>Juan Dela Cruz</h2>
        <p>Date: Nov 2, 2026 — 8:05 AM</p>
      </ion-label>
      <ion-badge color="success" slot="end">Present</ion-badge>
    </ion-item>

    <ion-item class="history-item ion-margin-bottom">
      <ion-label>
        <h2>Maria Clara</h2>
        <p>Date: Nov 2, 2026 — 8:30 AM</p>
      </ion-label>
      <ion-badge color="warning" slot="end">Late</ion-badge>
    </ion-item>

    <ion-item class="history-item ion-margin-bottom">
      <ion-label>
        <h2>Pedro Penduko</h2>
        <p>Date: Nov 1, 2026 — 8:00 AM</p>
      </ion-label>
      <ion-badge color="success" slot="end">Present</ion-badge>
    </ion-item>

  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-tab-bar>
      
      <ion-tab-button tab="attendance">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-label>Attendance</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="history">
        <ion-icon name="time-outline"></ion-icon>
        <ion-label>History</ion-label>
      </ion-tab-button>
 
      <ion-tab-button tab="profile" >
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="archive" >
        <ion-icon name="archive-outline"></ion-icon>
        <ion-label>Archive</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="report">
        <ion-icon name="bar-chart-outline"></ion-icon>
        <ion-label>Report</ion-label>
      </ion-tab-button>

    </ion-tab-bar>
  </ion-toolbar>
</ion-footer>
